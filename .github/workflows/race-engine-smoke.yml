name: Race engine and static assets smoke tests

on:
  pull_request:
    paths:
      - 'index.html'
      - 'game.js'
      - 'motorcycle.js'
      - 'assets/**'
      - 'logo-nucifera.jpg'
      - 'android/app/src/main/game/**'
      - 'tests/**'
      - '.github/workflows/race-engine-smoke.yml'
  push:
    branches:
      - main
      - 'test/race-engine-ci-*'
    paths:
      - 'index.html'
      - 'game.js'
      - 'motorcycle.js'
      - 'assets/**'
      - 'logo-nucifera.jpg'
      - 'android/app/src/main/game/**'
      - 'tests/**'
      - '.github/workflows/race-engine-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check game.js
          node --check motorcycle.js
      - name: Run deterministic race regression and static asset tests
        run: node --test tests/*.test.cjs
